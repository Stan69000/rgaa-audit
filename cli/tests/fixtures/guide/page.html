<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"><title>Page de test du guide – Association</title>
<style>body{font:16px Arial,sans-serif;color:#222;background:#fff;margin:0} a.plain{color:#222;text-decoration:none} main{padding:16px}</style>
</head>
<body>
<header><a href="#contenu">Aller au contenu</a> <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Logo de l’association" width="80" height="40"></header>

  <iframe title="Carte du local" src="about:blank" width="200" height="100"></iframe>
  <video width="160" height="90" controls><source src="video.mp4"></video>
  <form>
    <label for="nom">Nom</label><input id="nom" name="nom">
    <label for="x">Champ</label><input id="x" name="x">
    <button type="submit">OK</button>
