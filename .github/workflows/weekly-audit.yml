name: Audit hebdomadaire

on:
  schedule:
    - cron: '0 7 * * 1'   # Lundi 7h UTC
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs a auditer (une par ligne)'
        required: false
      min_score:
        description: 'Seuil minimal du score technique C/(C+NC), 0-100'
        required: false
        default: '70'

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  resolve-targets:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.targets.outputs.urls }}
      min_score: ${{ steps.targets.outputs.min_score }}
    steps:
      - id: targets
        shell: bash
        run: |
          set -euo pipefail

          INPUT_URLS="${{ github.event.inputs.urls || '' }}"
          SECRET_URLS="${{ secrets.AUDIT_URLS || '' }}"
          # Depuis 0.3.0, les points « a verifier » ne baissent plus le score : seuil releve de 50 a 70.
          MIN_SCORE="${{ github.event.inputs.min_score || '70' }}"

          if [[ -n "$INPUT_URLS" ]]; then
            RAW="$INPUT_URLS"
          elif [[ -n "$SECRET_URLS" ]]; then
            RAW="$SECRET_URLS"
          else
            RAW="https://example.com"
          fi

          JSON=$(printf '%s\n' "$RAW" | sed '/^\s*$/d' | jq -R -s -c 'split("\n")[:-1]')

          echo "urls=$JSON" >> "$GITHUB_OUTPUT"
          echo "min_score=$MIN_SCORE" >> "$GITHUB_OUTPUT"

  audit-sites:
    name: Audit ${{ matrix.url }}
    runs-on: ubuntu-latest
    needs: resolve-targets
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.resolve-targets.outputs.urls) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install
        working-directory: cli
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Target key
        id: key
        shell: bash
        run: echo "name=$(echo "${{ matrix.url }}" | sed 's|https\?://||;s|[^A-Za-z0-9._-]|-|g')" >> "$GITHUB_OUTPUT"

      # Rapport de la semaine precedente, s'il existe : sert de reference pour les regressions.
      - name: Restore previous report
        uses: actions/cache/restore@v4
        with:
          path: baseline-${{ steps.key.outputs.name }}.json
          key: audit-baseline-${{ steps.key.outputs.name }}-${{ github.run_id }}
          restore-keys: audit-baseline-${{ steps.key.outputs.name }}-

      - name: Audit target
        working-directory: cli
        shell: bash
        run: |
          set -euo pipefail
          SAFE_NAME="${{ steps.key.outputs.name }}"
          BASELINE_ARGS=()
          if [[ -f "../baseline-${SAFE_NAME}.json" ]]; then
            BASELINE_ARGS=(--baseline "../baseline-${SAFE_NAME}.json" --fail-on-new)
          fi

          # Un seul passage : rapport JSON (seuil, regressions) et rapport HTML vulgarise.
          node bin/rgaa-audit.js "${{ matrix.url }}" \
            -o json \
            -s "../rapport-${SAFE_NAME}.json" \
            --vulgarized-save "../rapport-${SAFE_NAME}.html" \
            "${BASELINE_ARGS[@]}"

      - name: Save report as next baseline
        if: always()
        shell: bash
        run: |
          SAFE_NAME="${{ steps.key.outputs.name }}"
          if [[ -f "rapport-${SAFE_NAME}.json" ]]; then cp "rapport-${SAFE_NAME}.json" "baseline-${SAFE_NAME}.json"; fi

      - name: Store baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: baseline-${{ steps.key.outputs.name }}.json
          key: audit-baseline-${{ steps.key.outputs.name }}-${{ github.run_id }}

      - name: Enforce minimum score
        shell: bash
        run: |
          set -euo pipefail
          SAFE_NAME="${{ steps.key.outputs.name }}"
          SEUIL="${{ needs.resolve-targets.outputs.min_score }}"

          node -e "
            const r = require('./rapport-${SAFE_NAME}.json');
            const taux = r.score.taux;
            const seuil = Number(process.env.SEUIL);
            console.log('URL:', process.env.URL_TO_AUDIT);
            console.log('Taux:', taux + '%', '| Seuil:', seuil + '%');
            if (Number.isNaN(seuil)) throw new Error('Seuil invalide');
            if (taux < seuil) {
              throw new Error('Taux sous le seuil minimal');
            }
          "
        env:
          SEUIL: ${{ needs.resolve-targets.outputs.min_score }}
          URL_TO_AUDIT: ${{ matrix.url }}

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audit-${{ strategy.job-index }}-${{ github.run_number }}
          path: rapport-*.*
          retention-days: 90
