name: Site security monitoring

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL publique a verifier'
        required: false
        default: 'https://stan69000.github.io/rgaa-audit/'

permissions:
  contents: read
  issues: write

jobs:
  check-site:
    name: Check availability and security controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve target URL
        id: target
        env:
          TARGET_URL: ${{ inputs.target_url || 'https://stan69000.github.io/rgaa-audit/' }}
        run: |
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"

      - name: Check HTTP status and TLS endpoint
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          # Retry transient transport failures (including TLS handshake errors).
          # Keep certificate verification enabled and bound the total request time.
          if STATUS=$(curl --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 100 \
            --dump-header /tmp/site-headers.txt \
            --output /tmp/site-body.html --write-out "%{http_code}" "$TARGET_URL"); then
            echo "HTTP status: $STATUS"
          else
            CURL_EXIT=$?
            echo "::error::Site inaccessible apres tentatives: curl code $CURL_EXIT (HTTP $STATUS)"
            exit "$CURL_EXIT"
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::error::Site status invalide: $STATUS"
            exit 1
          fi

      - name: Validate in-page security policies
        run: |
          set -euo pipefail
          grep -Eiq 'http-equiv=["'"'"']Content-Security-Policy["'"'"']|content-security-policy' /tmp/site-body.html
          grep -Eiq 'meta[^>]*name=["'"'"']referrer["'"'"']' /tmp/site-body.html
          grep -Eiq 'http-equiv=["'"'"']Permissions-Policy["'"'"']|permissions-policy' /tmp/site-body.html

      - name: Alert by opening issue on failure
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = `[security-monitoring] Echec verification site (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              'Le monitoring securite du site a detecte un probleme.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'Verifier rapidement la disponibilite du site et les meta-politiques de securite.'
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'security,monitoring',
              per_page: 20
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.data[0].number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['security', 'monitoring']
              });
            }
