version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/cli"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
      - "security"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # init, autobuild et analyze doivent rester sur la même version, sinon CodeQL échoue
      codeql-action:
        patterns:
          - "github/codeql-action*"
      ci-safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
